      <text class="lbl" x="182" y="527" text-anchor="end">בני בצי</text>
      <rect class="bar" x="558" y="514" width="2" height="16" rx="2" fill="#C2521F"></rect>
      <text class="val" x="567" y="527" text-anchor="start">+1</text>
    </g><g data-i="39" tabindex="0" role="button" aria-label="השוערים, הפרש -1">
